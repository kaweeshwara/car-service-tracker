<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Service Record — Car Service Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav>
    <a class="brand" href="/cars">&#128663; Car Service Tracker <span>v1</span></a>
    <a href="/cars">My Cars</a>
</nav>
<div class="container">
    <div class="breadcrumb">
        <a href="/cars">Cars</a>
        <span class="sep">&#8250;</span>
        <a th:href="@{/cars/{id}(id=${car.id})}" th:text="${car.displayName}"></a>
        <span class="sep">&#8250;</span>
        <span>New Service Record</span>
    </div>

    <div class="card form-card">
        <div class="card-header">
            <h2>&#128295; Add Service Record</h2>
            <span class="badge badge-blue" th:text="${car.displayName}"></span>
        </div>

        <form action="/records/save" method="post">
            <input type="hidden" name="carId" th:value="${car.id}">
            <input type="hidden" name="recordId" th:value="${record.id}">

            <div class="form-group">
                <label for="serviceType">Service Type</label>
                <select id="serviceType" name="serviceType" required>
                    <option value="">— Select a service type —</option>
                    <option th:each="type : ${serviceTypes}"
                            th:value="${type}" th:text="${type}"
                            th:selected="${type == record.serviceType}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description"
                          th:text="${record.description}"
                          placeholder="What was done? Any parts replaced?" required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="serviceDate">Service Date</label>
                    <input type="date" id="serviceDate" name="serviceDate"
                           th:value="${record.serviceDate}" required>
                </div>
                <div class="form-group">
                    <label for="mileage">Mileage</label>
                    <input type="number" id="mileage" name="mileage"
                           th:value="${record.mileage != 0 ? record.mileage : ''}"
                           min="0" placeholder="e.g. 45000" required>
                    <div class="form-hint">Odometer reading at time of service</div>
                </div>
            </div>

            <div class="form-group">
                <label for="cost">Total Cost ($)</label>
                <input type="number" id="cost" name="cost"
                       th:value="${record.cost != 0 ? record.cost : ''}"
                       min="0" step="0.01" placeholder="0.00" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">&#10003; Save Record</button>
                <a th:href="@{/cars/{id}(id=${car.id})}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
