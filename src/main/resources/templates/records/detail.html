<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Service Record — Car Service Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav>
    <a class="brand" href="/cars">&#128663; Car Service Tracker</a>
    <a href="/cars">My Cars</a>
</nav>
<div class="container">
    <div class="breadcrumb">
        <a href="/cars">Cars</a> <span>/</span>
        <a th:href="@{/cars/{id}(id=${car.id})}" th:text="${car.displayName}"></a> <span>/</span>
        <span th:text="${record.serviceType}"></span>
    </div>

    <div class="page-header">
        <h1 th:text="${record.serviceType}"></h1>
        <div style="display:flex;gap:0.5rem;">
            <a th:unless="${record.hasReview()}"
               th:href="@{/records/{id}/review(id=${record.id})}"
               class="btn btn-warning">&#9733; Leave Review</a>
            <a th:if="${record.hasReview()}"
               th:href="@{/records/{id}/review(id=${record.id})}"
               class="btn btn-outline btn-sm">Edit Review</a>
            <form th:action="@{/records/{id}/delete(id=${record.id})}" method="post"
                  onsubmit="return confirm('Delete this record?')">
                <button class="btn btn-danger btn-sm">Delete</button>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="meta-grid">
            <div class="meta-item">
                <label>Car</label>
                <div class="value" th:text="${car.displayName}"></div>
            </div>
            <div class="meta-item">
                <label>Service Date</label>
                <div class="value" th:text="${#temporals.format(record.serviceDate,'MMMM dd, yyyy')}"></div>
            </div>
            <div class="meta-item">
                <label>Mileage</label>
                <div class="value" th:text="${#numbers.formatInteger(record.mileage,1,'COMMA')} + ' mi'"></div>
            </div>
            <div class="meta-item">
                <label>Cost</label>
                <div class="value" th:text="'$' + ${#numbers.formatDecimal(record.cost,1,2)}"></div>
            </div>
        </div>
        <div style="margin-top:0.75rem;">
            <label style="font-size:0.75rem;text-transform:uppercase;color:#888;display:block;margin-bottom:0.3rem;">Description</label>
            <p th:text="${record.description}" style="font-size:0.95rem;line-height:1.6;"></p>
        </div>
    </div>

    <!-- Review section -->
    <div th:if="${record.hasReview()}" class="card">
        <div class="card-header">
            <h2>Review</h2>
            <a th:href="@{/records/{id}/review(id=${record.id})}" class="btn btn-outline btn-sm">Edit</a>
        </div>
        <div class="stars" th:text="${record.review.stars}"></div>
        <p th:text="${record.review.comment}"
           style="margin-top:0.5rem;font-size:0.95rem;color:#444;line-height:1.6;"></p>
        <p style="margin-top:0.5rem;font-size:0.8rem;color:#999;"
           th:text="'Reviewed on ' + ${#temporals.format(record.review.reviewedAt,'MMM dd, yyyy')}"></p>
    </div>

    <div th:unless="${record.hasReview()}" class="card empty">
        <p>No review yet for this service record.</p>
        <a th:href="@{/records/{id}/review(id=${record.id})}" class="btn btn-warning">&#9733; Leave a Review</a>
    </div>
</div>
</body>
</html>
