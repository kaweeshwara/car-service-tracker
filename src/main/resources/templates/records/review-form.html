<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leave a Review — Car Service Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav>
    <a class="brand" href="/cars">&#128663; Car Service Tracker <span>v1</span></a>
    <a href="/cars">My Cars</a>
</nav>
<div class="container">
    <div class="breadcrumb">
        <a href="/cars">Cars</a>
        <span class="sep">&#8250;</span>
        <a th:href="@{/cars/{id}(id=${car.id})}" th:text="${car.displayName}"></a>
        <span class="sep">&#8250;</span>
        <a th:href="@{/records/{id}(id=${record.id})}" th:text="${record.serviceType}"></a>
        <span class="sep">&#8250;</span>
        <span>Review</span>
    </div>

    <div class="card form-card">
        <div class="card-header">
            <h2 th:text="${record.hasReview()} ? '&#9998; Edit Review' : '&#9733; Leave a Review'"></h2>
        </div>

        <!-- Context strip -->
        <div style="background:var(--bg);border-radius:8px;padding:.85rem 1rem;margin-bottom:1.5rem;border:1px solid var(--border);">
            <div style="font-size:.8rem;color:var(--muted);margin-bottom:.2rem;">Reviewing service on</div>
            <div style="font-weight:700;" th:text="${car.displayName}"></div>
            <div style="font-size:.85rem;color:var(--muted);">
                <span th:text="${record.serviceType}"></span>
                &nbsp;&middot;&nbsp;
                <span th:text="${#temporals.format(record.serviceDate,'MMM dd, yyyy')}"></span>
                &nbsp;&middot;&nbsp;
                <span th:text="'$' + ${#numbers.formatDecimal(record.cost,1,2)}"></span>
            </div>
        </div>

        <form th:action="@{/records/{id}/review(id=${record.id})}" method="post">
            <div class="star-rating-wrap">
                <label class="sr-label">How would you rate this service?</label>
                <div class="star-rating" style="margin-bottom:1.25rem;">
                    <input type="radio" id="s5" name="rating" value="5" th:checked="${review.rating == 5}">
                    <label for="s5">&#9733;</label>
                    <input type="radio" id="s4" name="rating" value="4" th:checked="${review.rating == 4}">
                    <label for="s4">&#9733;</label>
                    <input type="radio" id="s3" name="rating" value="3" th:checked="${review.rating == 3}">
                    <label for="s3">&#9733;</label>
                    <input type="radio" id="s2" name="rating" value="2" th:checked="${review.rating == 2}">
                    <label for="s2">&#9733;</label>
                    <input type="radio" id="s1" name="rating" value="1" th:checked="${review.rating == 1}">
                    <label for="s1">&#9733;</label>
                </div>
            </div>

            <div class="form-group">
                <label for="comment">Your Review</label>
                <textarea id="comment" name="comment" rows="4"
                          placeholder="How was the service quality? Was it completed on time? Worth the cost?"
                          th:text="${review.comment}" required></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success">&#10003; Submit Review</button>
                <a th:href="@{/records/{id}(id=${record.id})}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
