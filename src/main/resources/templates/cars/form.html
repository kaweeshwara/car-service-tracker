<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Car Form — Car Service Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav>
    <a class="brand" href="/cars">&#128663; Car Service Tracker <span>v1</span></a>
    <a href="/cars">My Cars</a>
</nav>
<div class="container">
    <div class="breadcrumb">
        <a href="/cars">Cars</a>
        <span class="sep">&#8250;</span>
        <span th:text="${car.id != null} ? 'Edit Car' : 'New Car'"></span>
    </div>

    <div class="card form-card">
        <div class="card-header">
            <h2 th:text="${car.id != null} ? '&#9998; Edit Car' : '&#43; Add New Car'"></h2>
        </div>

        <form action="/cars/save" method="post">
            <input type="hidden" name="id" th:value="${car.id}">

            <div class="form-row">
                <div class="form-group">
                    <label for="make">Make</label>
                    <input type="text" id="make" name="make" th:value="${car.make}"
                           placeholder="e.g. Toyota" required>
                </div>
                <div class="form-group">
                    <label for="model">Model</label>
                    <input type="text" id="model" name="model" th:value="${car.model}"
                           placeholder="e.g. Camry" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" name="year" th:value="${car.year != 0 ? car.year : ''}"
                           min="1900" max="2100" placeholder="e.g. 2021" required>
                </div>
                <div class="form-group">
                    <label for="licensePlate">License Plate</label>
                    <input type="text" id="licensePlate" name="licensePlate" th:value="${car.licensePlate}"
                           placeholder="e.g. ABC-1234" required>
                </div>
            </div>
            <div class="form-group">
                <label for="ownerName">Owner Name</label>
                <input type="text" id="ownerName" name="ownerName" th:value="${car.ownerName}"
                       placeholder="e.g. Jane Doe" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">&#10003; Save Car</button>
                <a href="/cars" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
