<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cars — Car Service Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav>
    <a class="brand" href="/cars">&#128663; Car Service Tracker</a>
    <a href="/cars">My Cars</a>
</nav>
<div class="container">
    <div class="page-header">
        <h1>My Cars</h1>
        <a href="/cars/new" class="btn btn-primary">+ Add Car</a>
    </div>

    <div th:if="${cars.isEmpty()}" class="card empty">
        <p>No cars yet. Add your first car to get started.</p>
        <a href="/cars/new" class="btn btn-primary">+ Add Car</a>
    </div>

    <div th:each="car : ${cars}" class="card">
        <div class="card-header">
            <h2>
                <a th:href="@{/cars/{id}(id=${car.id})}"
                   th:text="${car.displayName}"
                   style="text-decoration:none;color:inherit;"></a>
            </h2>
            <div style="display:flex;gap:0.5rem;">
                <a th:href="@{/cars/{id}/edit(id=${car.id})}" class="btn btn-outline btn-sm">Edit</a>
                <form th:action="@{/cars/{id}/delete(id=${car.id})}" method="post"
                      onsubmit="return confirm('Delete this car and all its records?')">
                    <button class="btn btn-danger btn-sm">Delete</button>
                </form>
            </div>
        </div>
        <div class="meta-grid">
            <div class="meta-item">
                <label>License Plate</label>
                <div class="value" th:text="${car.licensePlate}"></div>
            </div>
            <div class="meta-item">
                <label>Owner</label>
                <div class="value" th:text="${car.ownerName}"></div>
            </div>
        </div>
        <a th:href="@{/cars/{id}(id=${car.id})}" class="btn btn-outline btn-sm">View Service Records &#8594;</a>
    </div>
</div>
</body>
</html>
