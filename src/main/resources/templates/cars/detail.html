<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${car.displayName} + ' — Car Service Tracker'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav>
    <a class="brand" href="/cars">&#128663; Car Service Tracker</a>
    <a href="/cars">My Cars</a>
</nav>
<div class="container">
    <div class="breadcrumb">
        <a href="/cars">Cars</a> <span>/</span>
        <span th:text="${car.displayName}"></span>
    </div>

    <div class="page-header">
        <h1 th:text="${car.displayName}"></h1>
        <a th:href="@{/records/new(carId=${car.id})}" class="btn btn-primary">+ Add Service Record</a>
    </div>

    <div class="card" style="margin-bottom:1.5rem;">
        <div class="meta-grid">
            <div class="meta-item">
                <label>License Plate</label>
                <div class="value" th:text="${car.licensePlate}"></div>
            </div>
            <div class="meta-item">
                <label>Owner</label>
                <div class="value" th:text="${car.ownerName}"></div>
            </div>
            <div class="meta-item">
                <label>Year</label>
                <div class="value" th:text="${car.year}"></div>
            </div>
        </div>
    </div>

    <h2 style="font-size:1.1rem;font-weight:700;margin-bottom:1rem;">Service Records</h2>

    <div th:if="${records.isEmpty()}" class="card empty">
        <p>No service records yet.</p>
        <a th:href="@{/records/new(carId=${car.id})}" class="btn btn-primary">+ Add First Record</a>
    </div>

    <div th:each="rec : ${records}" class="card">
        <div class="card-header">
            <div style="display:flex;align-items:center;gap:0.75rem;">
                <span class="badge badge-blue" th:text="${rec.serviceType}"></span>
                <span th:text="${#temporals.format(rec.serviceDate,'MMM dd, yyyy')}"></span>
            </div>
            <div style="display:flex;gap:0.5rem;">
                <a th:href="@{/records/{id}(id=${rec.id})}" class="btn btn-outline btn-sm">View</a>
                <form th:action="@{/records/{id}/delete(id=${rec.id})}" method="post"
                      onsubmit="return confirm('Delete this service record?')">
                    <button class="btn btn-danger btn-sm">Delete</button>
                </form>
            </div>
        </div>

        <p th:text="${rec.description}" style="color:#555;font-size:0.9rem;margin-bottom:0.75rem;"></p>

        <div class="meta-grid">
            <div class="meta-item">
                <label>Mileage</label>
                <div class="value" th:text="${#numbers.formatInteger(rec.mileage,1,'COMMA')} + ' mi'"></div>
            </div>
            <div class="meta-item">
                <label>Cost</label>
                <div class="value" th:text="'$' + ${#numbers.formatDecimal(rec.cost,1,2)}"></div>
            </div>
        </div>

        <div th:if="${rec.hasReview()}" class="review-box">
            <span class="stars" th:text="${rec.review.stars}"></span>
            <p th:text="${rec.review.comment}" style="font-size:0.9rem;color:#555;"></p>
        </div>
        <div th:unless="${rec.hasReview()}" style="margin-top:0.5rem;">
            <a th:href="@{/records/{id}/review(id=${rec.id})}" class="btn btn-warning btn-sm">&#9733; Leave a Review</a>
        </div>
    </div>
</div>
</body>
</html>
