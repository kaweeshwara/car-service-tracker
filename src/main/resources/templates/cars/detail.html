<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${car.displayName} + ' — Car Service Tracker'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav>
    <a class="brand" href="/cars">&#128663; Car Service Tracker <span>v1</span></a>
    <a href="/cars">My Cars</a>
</nav>
<div class="container">
    <div class="breadcrumb">
        <a href="/cars">Cars</a>
        <span class="sep">&#8250;</span>
        <span th:text="${car.displayName}"></span>
    </div>

    <!-- Car hero -->
    <div class="car-card">
        <div>
            <div class="car-title" th:text="${car.displayName}"></div>
            <div class="car-sub" th:text="'Owner: ' + ${car.ownerName}"></div>
        </div>
        <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
            <div class="car-plate" th:text="${car.licensePlate}"></div>
            <div style="display:flex;gap:.6rem;">
                <a th:href="@{/cars/{id}/edit(id=${car.id})}" class="btn btn-outline btn-sm"
                   style="border-color:rgba(255,255,255,.3);color:#e2e8f0;">Edit Car</a>
                <form th:action="@{/cars/{id}/delete(id=${car.id})}" method="post"
                      onsubmit="return confirm('Delete this car and all its records?')">
                    <button class="btn btn-sm"
                            style="background:rgba(220,38,38,.25);color:#fca5a5;border:1px solid rgba(220,38,38,.4);">
                        Delete
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Stats strip -->
    <div class="stats-strip">
        <div class="stat-card">
            <div class="stat-label">Total Services</div>
            <div class="stat-value" th:text="${records.size()}"></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Spent</div>
            <div class="stat-value" th:text="'$' + ${#numbers.formatDecimal(totalCost, 1, 0)}"></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Reviews Left</div>
            <div class="stat-value" th:text="${reviewCount} + ' / ' + ${records.size()}"></div>
        </div>
    </div>

    <!-- Service records -->
    <div class="page-header" style="margin-bottom:1rem;">
        <div class="section-title" style="flex:1;margin-bottom:0;">Service Records</div>
        <a th:href="@{/records/new(carId=${car.id})}" class="btn btn-primary btn-sm">&#43; Add Record</a>
    </div>

    <div th:if="${records.isEmpty()}" class="empty-state">
        <div class="empty-icon">&#128295;</div>
        <h3>No service records yet</h3>
        <p>Log your first service to start tracking maintenance history.</p>
        <a th:href="@{/records/new(carId=${car.id})}" class="btn btn-primary">&#43; Add First Record</a>
    </div>

    <div th:each="rec : ${records}" class="record-row">
        <div class="accent-bar"></div>
        <div>
            <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.2rem;">
                <span class="fw-700" th:text="${rec.serviceType}" style="font-size:.95rem;"></span>
                <span class="badge badge-blue"
                      th:text="${#temporals.format(rec.serviceDate,'MMM dd, yyyy')}"></span>
                <span th:if="${rec.hasReview()}" class="stars-sm">&#9733;</span>
            </div>
            <div class="rec-desc" th:text="${rec.description}"></div>
            <div class="rec-meta">
                <span>&#128200; <strong th:text="${#numbers.formatInteger(rec.mileage,1,'COMMA')} + ' mi'"></strong></span>
                <span>&#128181; <strong th:text="'$' + ${#numbers.formatDecimal(rec.cost,1,2)}"></strong></span>
            </div>
            <div th:if="${rec.hasReview()}" style="margin-top:.6rem;">
                <span class="stars" style="font-size:.95rem;" th:text="${rec.review.stars}"></span>
                <span class="text-sm text-muted" th:text="'  ' + ${rec.review.comment}"
                      style="font-style:italic;"></span>
            </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:.4rem;align-items:flex-end;">
            <a th:href="@{/records/{id}(id=${rec.id})}" class="btn btn-outline btn-sm">View</a>
            <a th:unless="${rec.hasReview()}"
               th:href="@{/records/{id}/review(id=${rec.id})}"
               class="btn btn-warning btn-sm">&#9733; Review</a>
            <form th:action="@{/records/{id}/delete(id=${rec.id})}" method="post"
                  onsubmit="return confirm('Delete this record?')">
                <button class="btn btn-ghost btn-sm" style="color:var(--danger);">&#128465;</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
